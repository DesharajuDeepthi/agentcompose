# Minimal config for local Docker testing using Qwen via OpenRouter.
# Set OPENROUTER_API_KEY env var — free tier available at openrouter.ai.

llms:
  default:
    provider: openai              # OpenRouter is OpenAI-compatible
    model: qwen/qwen3-8b
    base_url: https://openrouter.ai/api/v1
    temperature: 0.8
    api_key_env: OPENROUTER_API_KEY

agents:
  supervisor:
    kind: supervisor
    llm: default
    system_prompt: |
      You are the supervisor. Route tasks to available workers.

  assistant:
    kind: native_worker
    llm: default
    framework: langchain
    system_prompt: |
      You are a helpful assistant. Answer questions clearly and concisely.
    description: General purpose assistant
    timeout_seconds: 60

serving:
  api:
    host: 0.0.0.0
    port: 7777
    cors_origins: ["*"]
