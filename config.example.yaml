# AgentWeave — example configuration
# Copy this to config.yaml and fill in your API keys.
# Every field is optional unless marked (required).

# ─────────────────────────────────────────────
# LLM providers
# ─────────────────────────────────────────────
llms:
  default:
    provider: anthropic          # openai | anthropic | google | ollama
    model: claude-sonnet-5       # model id for the provider
    temperature: 0.7
    api_key_env: ANTHROPIC_API_KEY   # env var that holds your key

  fast:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    temperature: 0.3
    api_key_env: ANTHROPIC_API_KEY

  # Qwen via OpenRouter (free tier available — great for local testing)
  qwen:
    provider: openai              # OpenRouter is OpenAI-compatible
    model: qwen/qwen3-8b
    base_url: https://openrouter.ai/api/v1
    temperature: 0.8
    api_key_env: OPENROUTER_API_KEY

  # Uncomment to add OpenAI
  # gpt:
  #   provider: openai
  #   model: gpt-4o
  #   api_key_env: OPENAI_API_KEY

# ─────────────────────────────────────────────
# MCP tool servers
# ─────────────────────────────────────────────
mcp_servers:
  filesystem:
    transport: stdio
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    timeout_seconds: 30

  web_search:
    transport: stdio
    command: ["npx", "-y", "@modelcontextprotocol/server-brave-search"]
    timeout_seconds: 30

# ─────────────────────────────────────────────
# Tools (references into MCP servers)
# ─────────────────────────────────────────────
tools:
  read_file:
    server: filesystem
    tool_name: read_file

  write_file:
    server: filesystem
    tool_name: write_file

  search_web:
    server: web_search
    tool_name: brave_web_search

# ─────────────────────────────────────────────
# Skills (logical groups of tools)
# ─────────────────────────────────────────────
skills:
  file_ops:
    tools: [read_file, write_file]
    description: Read and write files on the filesystem

  research:
    tools: [search_web]
    description: Search the web for up-to-date information

# ─────────────────────────────────────────────
# Skillsets (bundles of skills given to an agent)
# ─────────────────────────────────────────────
skillsets:
  researcher_kit:
    skills: [research, file_ops]
    description: Tools for research and saving results

# ─────────────────────────────────────────────
# Agents
# ─────────────────────────────────────────────
agents:
  supervisor:
    kind: supervisor
    llm: default
    system_prompt: |
      You are the orchestrator for a research team.
      Route tasks to the appropriate worker agent.
      Available workers: researcher, writer.
      When you need user input, use the send_message tool.

  researcher:
    kind: native_worker
    llm: default
    framework: langchain        # langchain | openai | google_adk | smolagents
    skillset: researcher_kit
    system_prompt: |
      You are a research specialist. Search the web for accurate,
      up-to-date information and save your findings to files.
    description: Searches the web and saves results
    timeout_seconds: 120

  writer:
    kind: native_worker
    llm: fast
    framework: langchain
    skills: [file_ops]
    system_prompt: |
      You are a skilled writer. Read research files and produce
      clear, well-structured documents from them.
    description: Reads research and writes polished output
    timeout_seconds: 90

# ─────────────────────────────────────────────
# Graph behaviour
# ─────────────────────────────────────────────
graph:
  max_iterations: 15
  timeouts:
    worker_seconds: 120
    tool_call_seconds: 30

# ─────────────────────────────────────────────
# API server
# ─────────────────────────────────────────────
serving:
  api:
    host: 0.0.0.0
    port: 7777
    cors_origins: ["*"]   # tighten in production

# ─────────────────────────────────────────────
# A2A — external agent discovery (optional)
# ─────────────────────────────────────────────
a2a:
  discovery:
    seeds: []             # e.g. ["http://other-agent:8080"]
    timeout_seconds: 10
  import_policy:
    enabled: false
    mode: langgraph_nodes
    max_agents: 20
